          - type: accordion
            items:
              - title: What can NeOffice be used for?
                html: >-
                  <p>NeOffice is a workspace management app that helps you organise your day at work. With flexible work
                  becoming the norm, reinventing a workspace that is more collaborative &amp; productive for employees
                  is the need of the hour, and that’s where we come in. We are available as both a web &amp; mobile
                  app.</p>
              - title: How to manage hybrid work/flexible working with NeOffice?
                html: >-
                  <p>With NeOffice, employees can book the type of space that they want depending on their workday. Be
                  it a office desk , a parking slot or a cafeteria seat , NeOffice provides the employees with the
                  flexibility on how, where &amp; when the want to work</p>
              - title: What are all the features available in NeOffice?
                html: >-
                  <p>At NeOffice we offer a comprehensive set of features that will you get most out of your office
                  space. Our three-in-one solution includes Desk Booking, Meeting Room Booking &amp; Visitor Management
                  that is easy to implement and has everything you need create a perfect hybrid work environment</p>
              - title: Is NeOffice onsite or cloud-based?
                html: >-
                  <p>NeOffice is an easy to access cloud-based solution which makes deployment across any office
                  location very simple. We are hosted on AWS .</p>
              - title: Can I integrate NeOffice with my existing software?
                html: <p>Accordion Content</p>
              - title: What are the pre-requisites of NeOffice software?
                html: >-
                  <p>Being a cloud-based application, there are no additional requirements and our software can be
                  easily installed on desktop or mobile. Our team will work with you to understand your unique
                  requirements so you can get started without any difficulty.</p>
              - title: How do I get in touch with the team?
                html: <p>Accordion Content</p>
            id: 735b170
