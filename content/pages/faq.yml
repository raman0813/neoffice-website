            text: Scheduling & Space Booking
            id: 464cab7
            css:
              ' .w-el':
                d: color:#A1ABBC;font-family:'Poppins',sans-serif;font-size:24px;font-weight:600
                m: font-size:20px
          - type: accordion
            items:
              - title: Why is a workplace booking software important?
                html: >-
                  <p>Workspace scheduling software allows you to schedule whatever workspace you require using a single
                  tool. You can quickly view on the floor plan and book the places you require either on our mobile app
                  or on our webapp . Once booked the pass get generated and the seat is blocked for you. It's a flexible
                  way to work without the fuss.</p>
              - title: How do you book a space in office?
                html: >-
                  <p>Using NeOffice, you can book any type of space you require in office. Spaces like desks, meeting
                  rooms, parking, cafeteria seats can be easily booked under one single interface using an interactive
                  floorplan. Choose your time, date &amp; location – tap and its done. Learn more about managing office
                  space here. (will be linked to “book your work space” solution page)</p>
              - title: How will I know which spaces are available?
                html: >-
                  <p>You can search for available spaces by defining the type of space, reservation time, and amenities.
                  Baes on your criteria, NeOffice will display available desk or conference room or office spaces which
                  will get highlighted in green once booked.</p>
              - title: What are the different ways using which you can book your desks?
                html: >-
                  <p>You can manage your desks using three types of booking- hot desking, hoteling or on behalf
                  scheduling.</p><p>Hot desking, where employees share a common pool of desks instead of each employee
                  being assigned a permanent desk. You can block certain part of the office to a particular team and
                  only those team member can book there</p><p>Hoteling is a where you can inform the admin team to block
                  a seat for you for a specific duration of time and this seat is reserved only for you . <br />where
                  employees share a common pool of desks instead of each employee being assigned a permanent desk. You
                  can block certain part of the office to a particular team and only those team member can book
                  there</p><p>Scheduling is when employees are rostered to a set of desks depending on their shifts,
                  work or location. You can use different rules like scheduling one set of employees to come in on a
                  Mon- Wen – Fri and another set to come in on Tue- Thru- Fri.</p>
              - title: What is the use of meeting room booking software?
                html: >-
                  <p>Booking meeting rooms in advance will help the space being fully utilized thereby minimizing the
                  threat of no shows. You can also reschedule or cancel, invite &amp; notify visitors, opt for technical
                  support, all within minutes using NeOffice.</p>
              - title: What is a meeting room display & how can it be used?
                html: >-
                  <p>A meeting or conference room display is a touchscreen that is cloud-enabled and used by businesses
                  to organise meetings and meeting venues. It notifies employees when rooms are available, allows them
                  to check in for scheduled meetings, and allows them to secure meeting space on the spot if
                  available</p><p>NeOffice's simple room scheduling software works with iPads, and other tabs &amp;
                  Android devices. Many businesses install digital room displays outside of meeting rooms so that
                  employees can quickly see current and upcoming events, as well as capacity, equipment, and other
                  important room information.</p>
            id: a56be5a
