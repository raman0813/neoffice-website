            id: cb3a5f6
            css:
              ' .w-el':
                d: color:#A1ABBC;font-family:'Poppins',sans-serif;font-size:24px;font-weight:600
                m: font-size:20px
          - type: accordion
            items:
              - title: Why are workplace analytics important?
                html: >-
                  <p>Workplace analytics play a vital role in assisting the leadership team to understand their
                  operations and how best to optimize it. Getting an insight about what's going on in the organisation
                  and why, allows you to create sensible forecasts based on actual data.</p>
              - title: What are the metrics used by NeOffice software?
                html: >-
                  <p>We capture a variety of metrics as your employees interact with the platform, all without the need
                  for additional hardware or plugins. Number of desk bookings, percentage of ‘no shows’ for meetings,
                  guest visits to office are some of the metrics that we track.</p>
              - title: Can reports be generated based on the data captured by NeOffice?
                html: >-
                  <p>NeOffice makes it easier than ever to analyze all of your collected data and stats. The Insights
                  function in your admin dashboard automatically generates and interprets the metrics you require into
                  reports that give actionable analysis. You can figure out response to inquiries such as "How many
                  desks are being booked?" and "How many visitors have we had?" You can also customize your reports to
                  look at data of a particular t or entire office to gain a better understanding of how your space is
                  being used.</p>
            id: 74675c8
