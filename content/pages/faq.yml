          - type: accordion
            items:
              - title: How do you manage visitors in office?
                html: >-
                  <p>Workspace scheduling software allows you to schedule whatever workspace you require using a single
                  tool. You can quickly view on the floor plan and book the places you require either on our mobile app
                  or on our webapp . Once booked the pass get generated and the seat is blocked for you. It's a flexible
                  way to work without the fuss.</p>
              - title: How will I know when I have a visitor?
                html: >-
                  <p>Employees will receive alerts or notifications once the visitor sign-ins using the invite sent to
                  them through SMS or E-mail.</p>
              - title: Are visitor walk-ins possible?
                html: >-
                  <p>Yes, guests can also walk-in and key-in the necessary information at a kiosk near the front desk,
                  to gain entry into office. Customized photo badges &amp; print passes will also be provided.</p>
              - title: What is NeoVMS?
                html: >-
                  <p>NeoVMS (i.e.) NeOffice Visitor Management System is a companion app built to manage the visitor
                  flow at your office lobby in a contactless manner. The visitor on entering the premises can key in all
                  the necessary details on the tab that is available at the front desk. During the process, the visitor
                  photographs and ID proof is captured and an alert is automatically sent through SMS or Email to the
                  person he is visiting. A customized print pass or badge is provided to the visitor for entry.</p>
            id: ec78337
