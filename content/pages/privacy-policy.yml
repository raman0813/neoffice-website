                m: font-size:12px;line-height:18px
          - type: heading
            tag: h2
            text: |-
              <b>5. Your rights
              </b>
            id: d1e8ec3
            css:
              ' .w-el':
                d: color:#041D41;font-family:'Poppins',sans-serif;font-size:42px;font-weight:700
                t: font-size:26px
                m: font-size:20px;line-height:30px
          - type: heading
            tag: span
            text: >-
              You have the following rights under law in respect of your personal information:

              <li>The right to be informed about the collection and use of your personal information</li>

              <li>The right of access to your information to verify the legality of our use of it</li>

              <li>The right to request that inaccurate or incomplete information about you is rectified</li>

              <li>The right to request the deletion or removal of your information where there is no further reason for
              us to use it</li>

              <li>The right to restrict the use of your information</li>

              <li>The right to obtain and reuse the information that we have about you for your own purposes</li>

              <li>The right to object to certain uses (such as for marketing purposes)</li>

              <li>The right not to be subject to a decision that has a legal effect on you that has been based on an
              automated decision.</li><br>Should you wish to exercise any of these rights, you may do so at any time by
              writing to us at the address given below.&nbsp; In some cases, we are permitted to charge a small fee of
              no more than $ 10 in respect of our administrative costs.

              <br>If you would like to request the information we hold about you please mail us with your details to
              sales@neoffice.ai

              <br>The Site may, from time to time, contain links to and from the websites of our partner networks,
              advertisers and affiliates.&nbsp;If you follow a link to any of these websites, please note that these
              websites have their own privacy policies and that we do not accept any responsibility or liability for
              these policies.&nbsp;Please check these policies before you submit any personal data to these websites.
            id: '2792952'
            css:
