                m: font-size:20px;line-height:30px
          - type: heading
            tag: span
            text: >-
              All information about you that we collect or receive, whether of a personal or technical nature, may be
              used by us in the following ways:<li>To carry out our obligations arising from any contracts entered into
              between you and us and to provide you with the information, products and services that you request from
              us.</li><li>To provide you with information about other services that we, offer that are similar or
              relevant to those that you have already purchased or enquired about, such contact will only be made by
              email or phone from which you can opt out at any time, to notify you about changes to our
              services.</li><li>To administer the Site and for internal operations, including troubleshooting, system
              and security updates, data analysis, testing, research, statistical and survey purposes.</li><li>To
              improve the Site to ensure that content is presented in the most effective manner for you and for your
              computer.</li><li>To allow you to participate in interactive features of our service, when you choose to
              do so. As part of our efforts to keep the Site safe and secure.</li><li>To measure or understand the
              effectiveness of advertising we serve to you and others, and to deliver relevant promotional content to
              you.</li>
            id: d4c030e
            css:
              ' .w-el':
