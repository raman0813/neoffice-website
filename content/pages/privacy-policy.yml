            text: >-
              Agiledge Process Solutions &amp; Agiledge Neoffice are committed to protecting and respecting your
              privacy.<br><br>This policy, together with any other documents referred to in it, sets out the basis on
              which any personal data we collect from you, or that you provide to us, will be processed by us.&nbsp;
              Please read the following carefully to understand our views and practices regarding your personal data and
              how we will treat it.<br><br>By visiting this website neoffice.ai , you are accepting and consenting to
              the

              practices described in this policy.
            id: 9b798d2
