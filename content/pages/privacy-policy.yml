          - type: heading
            tag: p
            text: >-
              <b>Information you give us.</b>&nbsp;This is information about you that you give us by filling in forms on
              the website (Site), interacting with the Site or by corresponding with us by phone, e-mail or otherwise.
              It includes information you provide when you sign up to our newsletter service, make an enquiry about our
              products and services or log a support ticket.
            id: caa1a4e
            css:
              ' .w-el':
                d: color:#041D41;font-family:'Poppins',sans-serif;font-size:18px;font-weight:400;line-height:33px
                t: font-size:16px;line-height:30px
                m: font-size:12px;line-height:18px
          - type: heading
            tag: p
            text: >-
              The information you give us will include your name, address, e-mail address and phone number, as well as
              preliminary information about your business, interest on our product , services etc.
            id: 4ca64d2
            css:
              ' .w-el':
                d: color:#041D41;font-family:'Poppins',sans-serif;font-size:18px;font-weight:400;line-height:33px
                t: font-size:16px;line-height:30px
                m: font-size:12px;line-height:18px
          - type: heading
            tag: p
            text: >-
              <b>Information we collect about you.</b>&nbsp;This is information that we collect automatically about your
              visit in our website (Site).&nbsp; It typically involves technical information and is often collected
              using small data files called “cookies”.&nbsp; This information helps us to provide you with a good
              experience when you browse the Site and also to indicate where the site requires improvement. More
              information on how cookies work, what cookies we use and why can be found in our Cookie Policy which is
              part of this page below .
            id: 831f840
            css:
              ' .w-el':
                d: color:#041D41;font-family:'Poppins',sans-serif;font-size:18px;font-weight:400;line-height:33px
                t: font-size:16px;line-height:30px
                m: font-size:12px;line-height:18px
          - type: heading
            tag: p
            text: >-
              <b>Information we receive from other sources.</b><br>This is information that we receive about you if you
              use any of the other websites we operate. &nbsp;This

              also includes information that we receive from third parties, such as business partners, sub-

              contractors in technical services, advertising networks, analytics providers, search information

              providers and so on. &nbsp;We will notify you when we receive information about you from them and the

              purposes for which we intend to use that information.
            id: bd30c8e
            css:
              ' .w-el':
                d: color:#041D41;font-family:'Poppins',sans-serif;font-size:18px;font-weight:400;line-height:33px
                t: font-size:16px;line-height:30px
                m: font-size:12px;line-height:18px
          - type: heading
            tag: p
            text: >-
              <b>Social Media platforms</b><br>We operate social media platforms. It is our process and protocol that
              any personally identifiable

              data gathered on these platforms is only in response to users interacting out of their own volition

              with our marketing pages. The contact is deemed as a&nbsp;legitimate business enquiry. The personal

              contact data is removed from the site once the enquiry is processed or the user has requested so.
            id: d7e777d
            css:
              ' .w-el':
                d: color:#041D41;font-family:'Poppins',sans-serif;font-size:18px;font-weight:400;line-height:33px
                t: font-size:16px;line-height:30px
                m: font-size:12px;line-height:18px
          - type: heading
            tag: p
            text: >-
              <b>Analytics</b><br>Our website uses Google Analytics to collect information about how visitors use our
              website. We anonymise this data at the point of collection and automatically delete user and event data
              that is older than two years.
