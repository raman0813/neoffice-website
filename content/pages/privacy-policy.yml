          - type: heading
            tag: h2
            text: |-
              <b>4. Where we store your personal data
              </b>
            id: 3f9a93e
            css:
              ' .w-el':
                d: color:#041D41;font-family:'Poppins',sans-serif;font-size:42px;font-weight:700
                t: font-size:26px
                m: font-size:20px;line-height:30px
          - type: heading
            tag: span
            text: >-
              All information that you provide to us is stored on our, or our selected business partners’, secure
              servers, and we will take reasonable steps to protect your information in accordance with this
              policy,including (without limitation):

              <li>Installing a secure firewall</li>

              <li>Using anti-virus protection software</li>

              <li>Encrypting data; and</li>

              <li>Carrying out regular back-ups.</li><br>

              Unfortunately, the transmission of information via the internet is not completely secure. Although we will
              do our best to protect your personal data, we cannot guarantee the security of any data transmitted to the
              site and any such transmission is at your own risk. &nbsp;Once we have received your information, we will
              use strict procedures and security features to try to prevent unauthorised
            id: aabfda7
            css:
              ' .w-el':
                d: color:#041D41;font-family:'Poppins',sans-serif;font-size:18px;font-weight:400;line-height:33px
