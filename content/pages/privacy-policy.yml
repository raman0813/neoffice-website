          - type: heading
            tag: h2
            text: |-
              <b>3. Disclosure of your information 
              </b>
            id: 794c78c
            css:
              ' .w-el':
                d: color:#041D41;font-family:'Poppins',sans-serif;font-size:42px;font-weight:700
                t: font-size:26px
                m: font-size:20px;line-height:30px
          - type: heading
            tag: span
            text: >-
              We may share your information with:

              <li>Business partners, suppliers and sub-contractors for the performance of any contract we enter into
              with them.

              </li><li>Analytics and search engine providers that assist us in the improvement and optimisation of the
              site.</li>

              <li>Third party support services, such as, but not limited to project management tools, accounting systems
              and hosting data centre.</li><br>We will disclose your personal information to third parties:<br>

              <br>In the event that we sell or buy any business or assets, in which case we will disclose your personal
              data to the prospective seller or buyer of such business or assets.

              <br>If we, or substantially all of our assets, are acquired by a third party, in which case personal data
              held by us about our clients will be one of the transferred assets.

              <br>If we are under a duty to disclose or share your personal data in order to comply with any legal
              obligation, or in order to enforce or apply our terms of use and other agreements or To protect our
              rights, property or safety, or those of our clients or others.
            id: e26b5d7
            css:
              ' .w-el':
