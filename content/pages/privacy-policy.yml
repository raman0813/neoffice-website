          - type: heading
            tag: span
            text: "<br><b>Cookie Policy</b><br><br><br><b>Information about Our Use of Cookies</b><br>Our website uses cookies to distinguish you from other users of our website. This helps us to provide you with a good experience when you browse our website and also allows us to improve our website. \_Privacy laws in the European Economic Area (EEA), including the General Data Protection Regulation, or GDPR, require websites to obtain consent using or storing some cookies (or similar technologies) on your computers or mobile devices. \_By indicating your consent to the use of cookies, you agree that we can place cookies and other similar technology on your device, including a mobile device. This cookie policy provides you with clear and comprehensive information about the cookies we use and the purposes for using those cookies. To review the general privacy policies that apply to users, please read our\_above Privacy Policy."
            id: 5263a00
            css:
              ' .w-el':
                d: color:#041D41;font-family:'Poppins',sans-serif;font-size:18px;font-weight:400;line-height:33px
                t: font-size:16px;line-height:30px
                m: font-size:12px;line-height:18px
          - type: heading
            tag: span
            text: "<br><b>How to Delete and Block our Cookies</b><br> By indicating your consent to the use of cookies, you agree that we can place cookies on your device. If you do not consent, no cookies will be placed on your device, and no data will be collected.\_ You may also block or delete cookies by activating the setting on your browser that allows you to refuse the setting of all or some cookies. However, please note that if you use your browser settings to block all cookies (including essential cookies) you may not be able to access all or parts of our website.<br><br>For more information on how to delete or block cookies, See\_\nhttp://www.aboutcookies.org/\_<br>or\_http://w w.cookiecentral.com/faq/"
            id: e7afa31
            css:
              ' .w-el':
                d: color:#041D41;font-family:'Poppins',sans-serif;font-size:18px;font-weight:400;line-height:33px
                t: font-size:16px;line-height:30px
                m: font-size:12px;line-height:18px
          - type: heading
            tag: span
            text: >-
              <b>What Cookies Do We Use and Why?</b><br> To find out about specific cookies we use on this website,
              please see below for details. However, please note that not all cookies may be used in all jurisdictions
              or websites.

              <br>The cookies used on our website are categorized as follows:

              <li>Strictly Necessary</li>

              <li>Preferences</li>

              <li>Statistics</li>

              <li>Marketing</li>

              <li>Third Party</li>
            id: 567c757
            css:
              ' .w-el':
                d: color:#041D41;font-family:'Poppins',sans-serif;font-size:18px;font-weight:400;line-height:33px
                t: font-size:16px;line-height:30px
                m: font-size:12px;line-height:18px
          - type: heading
            tag: span
            text: >-
              <b>Strictly Necessary</b><br>Strictly necessary cookies let you move around the website and use essential
              features like accessing your profile and posting feedback. Without these cookies, these services cannot be
              provided. Please note that these cookies do not gather any information about you that could be used for
              marketing or remembering where you have been on the internet.<br>We use these strictly necessary cookies
              to:<li>Identify you as being logged in to our website; and</li><li>Enable you to submit information via
              online forms such as registration and feedback forms.</li><br>Accepting these cookies is a condition of
              using the website, so if you prevent these cookies we cannot guarantee your use of our website or how the
              security on our website will perform during your visit.
            id: 3473c2d
            css:
              ' .w-el':
                d: color:#041D41;font-family:'Poppins',sans-serif;font-size:18px;font-weight:400;line-height:33px
                t: font-size:16px;line-height:30px
                m: font-size:12px;line-height:18px
          - type: heading
            tag: span
            text: >-
              <b>Preferences</b><br>“Preference” cookies enable a website to remember information that changes the way
              the website behaves or looks, like your preferred language or the region that you are in. We use cookies
              that collect information about your choices and preferences. These cookies allow us to remember language
              or other local settings and customize the sites accordingly. We may store settings and preferences of our
              logged in users.
            id: 2c06f8e
            css:
              ' .w-el':
                d: color:#041D41;font-family:'Poppins',sans-serif;font-size:18px;font-weight:400;line-height:33px
                t: font-size:16px;line-height:30px
                m: font-size:12px;line-height:18px
          - type: heading
            tag: span
            text: >-
              <b>Statistic</b><br>“Statistic” cookies help website owners understand how visitors interact with websites
              by collecting and reporting information anonymously. We use cookies to create anonymous statistics to
              understand which pages are popular or less popular at our website. This information enables us to improve
              the website for all visitors without storing personal data.
            id: a9c9a4c
            css:
              ' .w-el':
                d: color:#041D41;font-family:'Poppins',sans-serif;font-size:18px;font-weight:400;line-height:33px
                t: font-size:16px;line-height:30px
                m: font-size:12px;line-height:18px
          - type: heading
            tag: span
            text: >-
              <b>“Marketing” </b><br>cookies are used to track visitors across websites. The intention is to display
              advertisements that are relevant and engaging for the individual user and thereby more valuable for
              publishers and third party advertisers. We use cookies to deliver many types of digital marketing. They
              store user data and behaviour information, which allows advertising agencies to target audience groups
              according to different variables, like age, gender, location, interests.
            id: 44e2d51
            css:
              ' .w-el':
                d: color:#041D41;font-family:'Poppins',sans-serif;font-size:18px;font-weight:400;line-height:33px
                t: font-size:16px;line-height:30px
                m: font-size:12px;line-height:18px
          - type: heading
            tag: span
            text: >-
              <b>Third Party Cookies“</b><br>Third Party” cookies are used within our services which are set by other
              organizations. We use cookies served by third parties in order to improve our website; personalize your
              experience; and understand how our website is used. <br>While accessing our website, some cookies may be
              sent from other websites like Face book, Twitter, etc. These Third Party cookies are responsible for
              having their own cookie and privacy policies. They are not under our control and are not monitored or
              reviewed by us. <br>Before using Third Party cookies, please read and understand their cookie and privacy
              policies to ensure you agree to their terms.
            id: b3259dc
            css:
              ' .w-el':
                d: color:#041D41;font-family:'Poppins',sans-serif;font-size:18px;font-weight:400;line-height:33px
