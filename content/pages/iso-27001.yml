        items:
          - type: heading
            tag: h2
            text: >-
              At Agiledge Solutions we take the data security of all our stakeholders, customers and partners very
              seriously. To ensure we comply with the

              highest level of data security possible, Agiledge Solutions has obtained the

              international ISO 27001- 2013 accreditation, in November 2022.<br><br>ISO 27001 certification is an
              auditable international standard that defines

              the requirements and compliance to an information security management

              system (ISMS).<br><br>An ISMS is a set of policies, procedures, processes, and systems that manage
              information risks, including but not limited to data privacy,

              customer confidentiality and organisational preparedness to ensure

              compliance to international cyber security standards.
            id: fdd1dde
            css:
              ' > .wc':
                t: padding:0 0 0 0
              ' .w-el':
                d: color:#041D41;font-family:'Poppins',sans-serif;font-size:18px;font-weight:400;line-height:33px
                m: font-size:12px;line-height:18px
          - type: heading
            tag: h2
            text: |-
              <b>An ISMS aligned to ISO 27001 brings about many organisational benefits,
              such as:</b><br><br><b>
            id: f61edda
            css:
              ' .w-el':
                d: color:#041D41;font-family:'Poppins',sans-serif;font-size:18px;font-weight:400;line-height:33px
                m: font-size:12px;line-height:18px
          - type: heading
            tag: h2
            text: |-
              <b>1.Convincing Evidence<br></b>The ability to provide convincing evidence that the necessary
              measures have been taken to comply with the data security requirements.
            id: 22dc375
            css:
              ' .w-el':
                d: color:#041D41;font-family:'Poppins',sans-serif;font-size:18px;font-weight:400;line-height:33px
                m: font-size:12px;line-height:18px
          - type: heading
            tag: h2
            text: |-
              <b>  2. Protection of Info<br></b>The protection of all corporate information and intellectual property –
              not just personal data.
            id: 44f38a3
            css:
              ' .w-el':
                d: color:#041D41;font-family:'Poppins',sans-serif;font-size:18px;font-weight:400;line-height:33px
                m: font-size:12px;line-height:18px
          - type: heading
            tag: h2
            text: |-
              <b> 3.  Risk Management<br></b>The ability to reduce, monitor and review risks as well as keep up
              with constantly evolving data security threat.
            id: 2a640be
            css:
              ' .w-el':
                d: color:#041D41;font-family:'Poppins',sans-serif;font-size:18px;font-weight:400;line-height:33px
                m: font-size:12px;line-height:18px
          - type: heading
            tag: h2
            text: |-
              <b>4. Awareness of Info Security<br></b>A company-wide culture of awareness surrounding information
              security.
            id: 131d2e2
            css:
              ' .w-el':
                d: color:#041D41;font-family:'Poppins',sans-serif;font-size:18px;font-weight:400;line-height:33px
                m: font-size:12px;line-height:18px
          - type: heading
            tag: h2
            text: >-
              When we deal with the information of our client companies and other

              stakeholders, we ensure we comply with all business, legal, contractual and

              regulatory requirements. We are not just another company handling your

              data, you can rely on us to do our utmost to protect your data.<br><br>Certification to ISO/IEC 27001
              demonstrates that our organisation has

              defined and put in place best-practice information security processes that

              are continually audited and updated.
            id: 051b1ed
